<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Job Application</title>
</head>
<body>
    <div class="container">
    <div class="apply_box">
        <h1>Job Application</h1> 
        <span class="required">(web)</span>
       
         <div class="box">
        <form action=""> 
        <div class="Form_container">
           <div class="Form_control">
             <label for="first_name">First Name:</label>   
             <input type="text" id="first_name" name="first_name" placeholder="Enter your first name" required>
             </div>
            <div class="Form_control">
             <label for="last_name">Last Name:</label>
             <input type="text" id="last_name" name="last_name" placeholder="Enter your last name" required>
             </div>
             <div class="Form_control">
             <label for="email">Email:</label>
             <input type="email" id="email" name="email" placeholder="Enter your email" required>
             </div>
             <div class="Form_control">

             <label for="city">City:</label>
             <input type="text" id="city" name="city" placeholder="Enter your city" required>
            </div>
        
            <div class="text_area">
             <label for="Address">Address:</label>
             <textarea id="Address" name="Address" placeholder="Enter your address" cols="40" rows="4" required></textarea>
            </div>

            <div class="Form_control">
            <label for="position">Position:</label>
            <select id="position" name="position" required>
                
                <option value="">Select a position</option>
                <option value="frontend">Frontend Developer</option>
                <option value="backend">Backend Developer</option>
                <option value="fullstack">Full Stack Developer</option>
            </select>
            </div>
            <div class="Form_control">
                <label for="pincode">Pin Code:</label>
                <input type="number" id="pincode" name="pincode" placeholder="Enter your pin code" required>
            </div>
            <div class="Form_control"> 
                <label for="resume">Upload Resume:</label>
                <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
            </div>
            <div class="Form_control">
                <label for="date">Date:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="button_container">
        
                <button type="submit">Apply Now</button>
            </div>

         </form>
         </div>

        </div>   

   </div>
   </div>
</body>
</html>
